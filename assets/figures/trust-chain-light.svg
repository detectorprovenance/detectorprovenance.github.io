<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Trust chain for signed detector data">
<defs><linearGradient id="g-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c8599"/><stop offset="1" stop-color="#0b7285"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7048e8"/><stop offset="1" stop-color="#5f3dc4"/></linearGradient><linearGradient id="g-indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4263eb"/><stop offset="1" stop-color="#364fc7"/></linearGradient><linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c7ed6"/><stop offset="1" stop-color="#1864ab"/></linearGradient><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f9e44"/><stop offset="1" stop-color="#24753a"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/></filter><marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#868e96"/></marker></defs>
<rect x="10" y="10" width="640" height="250" rx="22" fill="#7048e8" fill-opacity="0.07" stroke="#7048e8" stroke-opacity="0.35" stroke-width="1.5"/><text x="30" y="46" font-size="18" font-weight="700" letter-spacing="1.6" fill="#7048e8">DETECTOR<tspan font-weight="400" letter-spacing="0" fill="#495057" dx="10">during acquisition</tspan></text>
<rect x="10" y="330" width="640" height="250" rx="22" fill="#4263eb" fill-opacity="0.07" stroke="#4263eb" stroke-opacity="0.35" stroke-width="1.5"/><text x="30" y="366" font-size="18" font-weight="700" letter-spacing="1.6" fill="#4263eb">MANUFACTURER<tspan font-weight="400" letter-spacing="0" fill="#495057" dx="10">at manufacture</tspan></text>
<rect x="660" y="10" width="270" height="570" rx="22" fill="#2f9e44" fill-opacity="0.07" stroke="#2f9e44" stroke-opacity="0.35" stroke-width="1.5"/><text x="680" y="46" font-size="18" font-weight="700" letter-spacing="1.6" fill="#2f9e44">ANYONE<tspan font-weight="400" letter-spacing="0" fill="#495057" dx="10">offline</tspan></text>
<rect x="30" y="68" width="280" height="172" rx="16" fill="url(#g-cyan)" filter="url(#shadow)"/>
<rect x="164.0" y="90" width="24" height="19" rx="3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="159.0" y="96" width="24" height="19" rx="3" fill="#0b7285" stroke="#fff" stroke-width="2.6"/><rect x="154.0" y="102" width="24" height="19" rx="3" fill="#fff" fill-opacity="0.3" stroke="#fff" stroke-width="2.6"/>
<text x="170.0" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Frame digests</text>
<text x="170.0" y="194" text-anchor="middle" font-size="20" fill="#fff" fill-opacity="0.92">computed for every frame</text>
<text x="170.0" y="220" text-anchor="middle" font-size="20" fill="#fff" fill-opacity="0.92">as it is written</text>
<rect x="350" y="68" width="280" height="172" rx="16" fill="url(#g-violet)" filter="url(#shadow)"/>
<rect x="477.0" y="95" width="26" height="26" rx="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="485.0" y="103" width="10" height="10" rx="1.5" fill="#fff"/><path d="M483.0,95 v-6 M483.0,121 v6 M477.0,101 h-6 M503.0,101 h6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M490.0,95 v-6 M490.0,121 v6 M477.0,108 h-6 M503.0,108 h6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M497.0,95 v-6 M497.0,121 v6 M477.0,115 h-6 M503.0,115 h6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="490.0" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Secure element</text>
<text x="490.0" y="194" text-anchor="middle" font-size="20" fill="#fff" fill-opacity="0.92">signs the Merkle root</text>
<text x="490.0" y="220" text-anchor="middle" font-size="20" fill="#fff" fill-opacity="0.92">once per run</text>
<rect x="30" y="388" width="280" height="172" rx="16" fill="url(#g-indigo)" filter="url(#shadow)"/>
<path d="M170.0,410 L185.0,416 V429 C185.0,438 178.0,444 170.0,447 C162.0,444 155.0,438 155.0,429 V416 Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M164.0,429 L169.0,434 L177.0,424" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="170.0" y="482" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Root CA</text>
<text x="170.0" y="514" text-anchor="middle" font-size="20" fill="#fff" fill-opacity="0.92">certifies device keys</text>
<text x="170.0" y="540" text-anchor="middle" font-size="20" fill="#fff" fill-opacity="0.92">through an issuing CA</text>
<rect x="350" y="388" width="280" height="172" rx="16" fill="url(#g-blue)" filter="url(#shadow)"/>
<rect x="474.0" y="410" width="26" height="32" rx="3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M480.0,419 h14 M480.0,426 h10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="500.0" cy="437" r="7" fill="#1864ab" stroke="#fff" stroke-width="2.6"/><path d="M496.0,443 l-2,6 M504.0,443 l2,6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="490.0" y="482" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Device certificate</text>
<text x="490.0" y="514" text-anchor="middle" font-size="20" fill="#fff" fill-opacity="0.92">binds the detector key</text>
<text x="490.0" y="540" text-anchor="middle" font-size="20" fill="#fff" fill-opacity="0.92">to its serial number</text>
<rect x="678" y="110" width="234" height="410" rx="16" fill="url(#g-green)" filter="url(#shadow)"/>
<circle cx="791.0" cy="158" r="13" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M801.0,168 L811.0,178" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path d="M785.0,158 L789.0,163 L797.0,153" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="795.0" y="230" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Verifier</text>
<text x="795.0" y="264" text-anchor="middle" font-size="20" fill="#fff" fill-opacity="0.92">checks the signature</text>
<text x="795.0" y="290" text-anchor="middle" font-size="20" fill="#fff" fill-opacity="0.92">and certificate chain</text>
<text x="795.0" y="348" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.4" fill="#fff" fill-opacity="0.8">REPORTS</text>
<rect x="713.0" y="372" width="164" height="44" rx="22" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.55" stroke-width="1.5"/><text x="795.0" y="401" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Integrity</text><rect x="713.0" y="428" width="164" height="44" rx="22" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.55" stroke-width="1.5"/><text x="795.0" y="457" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Assurance</text>
<path d="M314,154.0 H346" fill="none" stroke="#868e96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M314,474.0 H346" fill="none" stroke="#868e96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M634,154.0 H674" fill="none" stroke="#868e96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<path d="M490.0,384 V244" fill="none" stroke="#868e96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<text x="476.0" y="301" text-anchor="end" font-size="20" font-style="italic" fill="#495057">certifies the key</text>
<path d="M170.0,564 V612 H795.0 V524" fill="none" stroke="#868e96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#head)"/>
<text x="482.5" y="643" text-anchor="middle" font-size="20" font-style="italic" fill="#495057">published root certificate</text>
</svg>

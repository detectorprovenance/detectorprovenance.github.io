name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install MyST
        run: npm install -g mystmd
      - name: Fetch the site template
        run: myst build
      - name: Patch theme (flat search)
        run: python3 scripts/patch_theme.py
      # A repository named <org>.github.io is served from the domain root;
      # any other repository is served under /<repository name>.
      - name: Build site
        run: |
          if [[ "$REPO" != *.github.io ]]; then
            export BASE_URL="/$REPO"
          fi
          myst build --html
        env:
          REPO: ${{ github.event.repository.name }}
      # MyST publishes only pages and the files they reference, so the demo
      # vendor's certificates, lists and data are copied in as static files.
      - name: Add the demo vendor files
        run: cp -r demo-vendor _build/html/demo-vendor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
